<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>吃什么 · 可交互演示</title>
<style>
/* ============================================================
   「吃什么」界面预览样式
   与小程序 app.wxss 同一套设计令牌（1rpx = 0.5px）
   ============================================================ */

:root {
  --primary: #FF8B3D;
  --primary-soft: #FFF1E5;
  --bg: #FFF8F1;
  --card: #FFFFFF;
  --apricot: #FFD8B5;
  --apricot-soft: #FFEFE1;
  --sage: #A8C79D;
  --sage-soft: #EEF5EA;
  --text: #49352A;
  --text2: #8B7B72;
  --text3: #B9ACA3;
  --divider: #EFE5DC;
  --coral: #F59A86;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #F6ECE1;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: #F0E6DA;
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.92em;
}

/* ---------------- 页头 ---------------- */
.top {
  max-width: 1440px;
  margin: 0 auto;
  padding: 40px 32px 8px;
}

.top-brand {
  display: flex;
  align-items: center;
  gap: 18px;
}

.top-brand img {
  width: 84px;
  height: 84px;
  flex-shrink: 0;
}

.top h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.4px;
}

.top p {
  margin: 6px 0 0;
  color: var(--text2);
  font-size: 14px;
}

.top-note {
  margin-top: 22px;
  padding: 16px 20px;
  border-radius: 14px;
  background: #FFFDFA;
  border: 1px solid #EADFD2;
  color: #6B5849;
  font-size: 13.5px;
  line-height: 1.75;
}

.top-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}

.top-nav a {
  font-size: 13px;
  color: #8A5A2B;
  text-decoration: none;
  background: #FFF1E5;
  border: 1px solid #F4D9BF;
  border-radius: 999px;
  padding: 6px 14px;
  transition: background 140ms ease;
}

.top-nav a:hover { background: #FFE3CB; }

/* ---------------- 手机墙 ---------------- */
.wall {
  max-width: 1440px;
  margin: 0 auto;
  padding: 28px 32px 60px;
  display: flex;
  flex-wrap: wrap;
  gap: 40px 36px;
  align-items: flex-start;
}

.phone-wrap {
  margin: 0;
  width: 375px;
}

.phone {
  width: 375px;
  height: 760px;
  background: var(--bg);
  border-radius: 34px;
  border: 1px solid #E4D6C6;
  box-shadow: 0 18px 40px -18px rgba(73, 53, 42, 0.28), 0 2px 0 rgba(255, 255, 255, 0.6) inset;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

.statusbar {
  height: 24px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  font-size: 10px;
  color: var(--text2);
  letter-spacing: 0.5px;
}

.sb-icons { font-size: 9px; letter-spacing: 1px; }

/* 微信右上角胶囊（示意） */
.capsule {
  position: absolute;
  top: 7px;
  right: 11px;
  width: 76px;
  height: 28px;
  border-radius: 14px;
  border: 1px solid rgba(73, 53, 42, 0.16);
  background: rgba(255, 255, 255, 0.7);
  display: flex;
  align-items: center;
  justify-content: space-around;
  font-size: 11px;
  color: var(--text3);
  z-index: 3;
}

.capsule i {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 1px solid rgba(73, 53, 42, 0.22);
  display: block;
}

.navbar {
  height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 0 12px;
  position: relative;
}

.nav-title {
  position: absolute;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 16px;
  font-weight: 600;
  pointer-events: none;
}

.nav-left, .nav-right {
  flex: 1;
  font-size: 14px;
  color: var(--text2);
  z-index: 1;
}

.nav-right { text-align: right; }

.screen {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 16px 28px;
  scrollbar-width: thin;
  scrollbar-color: #E0D2C2 transparent;
}

.screen::-webkit-scrollbar { width: 5px; }
.screen::-webkit-scrollbar-thumb {
  background: #E0D2C2;
  border-radius: 3px;
}

.screen--tab { padding-bottom: 16px; }

.screen > *:first-child { margin-top: 0; }

.cap {
  display: none;
}

figcaption {
  margin-top: 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  padding-left: 4px;
}

.cap-num {
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: var(--primary);
  border-radius: 6px;
  padding: 2px 7px;
  letter-spacing: 0.5px;
}

.cap-title {
  font-size: 15px;
  font-weight: 600;
}

.cap-sub {
  font-size: 12px;
  color: var(--text2);
  width: 100%;
  padding-left: 0;
}

.tab-label {
  font-size: 10px;
  color: var(--text2);
  margin-top: 3px;
}

.tab--on .tab-label { color: var(--primary); }

.tab-center { justify-content: flex-start; }

.fab {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  margin-top: -24px;
  background: linear-gradient(180deg, #FF9E5C 0%, #FF8B3D 100%);
  box-shadow: 0 5px 11px rgba(255, 139, 61, 0.32);
  border: 3px solid var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
}

.fab i {
  position: relative;
  display: block;
  width: 18px;
  height: 2px;
  border-radius: 1px;
  background: #fff;
}

.fab i::before {
  content: '';
  position: absolute;
  left: 8px;
  top: -8px;
  width: 2px;
  height: 18px;
  border-radius: 1px;
  background: #fff;
}

.tab-label--fab { color: var(--primary); }

/* ---------------- 通用 ---------------- */
.grow { flex: 1; min-width: 0; }

.card {
  background: var(--card);
  border: 1px solid var(--divider);
  border-radius: 12px;
  padding: 14px;
}

.card-soft {
  background: var(--apricot-soft);
  border-color: transparent;
}

.btn {
  height: 44px;
  border: none;
  border-radius: 22px;
  font-size: 15px;
  font-family: inherit;
  color: #fff;
  background: var(--primary);
  padding: 0 20px;
  cursor: pointer;
}

.btn-primary { background: var(--primary); }
.btn-ghost {
  background: transparent;
  color: var(--text2);
  border: 1px solid var(--divider);
}
.btn-soft { background: var(--apricot-soft); color: var(--primary); }
.btn-sage { background: var(--sage); }
.btn-block { display: block; width: 100%; }
.btn-sm {
  height: 32px;
  border-radius: 16px;
  font-size: 13px;
  padding: 0 14px;
}

.tag {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  line-height: 1.4;
}

.tag-soft { background: var(--apricot-soft); color: var(--primary); }
.tag-apricot { background: var(--apricot); color: #8A4A17; }
.tag-sage { background: var(--sage-soft); color: #5C7A52; }
.tag-plain { background: #F6F1EC; color: var(--text2); }

.level {
  display: inline-block;
  font-size: 11px;
  color: var(--primary);
  background: var(--apricot-soft);
  border-radius: 999px;
  padding: 2px 8px;
}

.cell-arrow { color: var(--text3); font-size: 13px; }

.ava {
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 600;
  overflow: hidden;
}

.ava-img { width: 100%; height: 100%; border-radius: 50%; }
.ava-xs { width: 20px; height: 20px; font-size: 10px; }
.ava-sm { width: 28px; height: 28px; font-size: 12px; }
.ava-md { width: 40px; height: 40px; font-size: 16px; }
.ava-lg { width: 64px; height: 64px; font-size: 24px; }
.ava-xl { width: 80px; height: 80px; font-size: 30px; }

.section { margin-top: 20px; }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 10px;
}

.section-title { font-size: 16px; font-weight: 600; }
.section-more { font-size: 12px; color: var(--text2); }

/* ---------------- 首页 ---------------- */
.hd { padding: 14px 0 4px; }

.hd-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.hd-brand { display: flex; align-items: center; }
.hd-logo { width: 32px; height: 32px; }
.hd-name {
  font-size: 20px;
  font-weight: 600;
  margin-left: 6px;
  letter-spacing: 0.5px;
}

.hd-region {
  display: flex;
  align-items: center;
  height: 30px;
  padding: 0 11px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--divider);
  font-size: 12px;
  max-width: 160px;
}

.hd-caret { color: var(--text2); font-size: 11px; margin-left: 4px; }
.hd-slogan { font-size: 12px; color: var(--text2); margin-top: 5px; }

.meal-tabs { display: flex; gap: 8px; padding: 4px 0; }

.meal-tab {
  flex: 1;
  text-align: center;
  height: 38px;
  line-height: 38px;
  border-radius: 19px;
  font-size: 14px;
  color: var(--text2);
  background: transparent;
}

.meal-tab--on { background: var(--primary); color: #fff; font-weight: 500; }

.meal-tabs--seg {
  background: #F6F1EC;
  border-radius: 999px;
  padding: 3px;
  margin-top: 12px;
}

.rand {
  display: flex;
  align-items: center;
  margin-top: 12px;
  padding: 11px 12px;
  border-radius: 12px;
  background: var(--apricot-soft);
}

.rand-dog { width: 48px; height: 48px; flex-shrink: 0; }
.rand-q { font-size: 13px; color: var(--text2); }
.rand-a { font-size: 16px; font-weight: 600; color: var(--primary); margin-top: 2px; }

.feed-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 20px;
}

.feed-tabs { display: flex; gap: 20px; }

.feed-tab {
  font-size: 15px;
  color: var(--text2);
  padding-bottom: 4px;
  position: relative;
}

.feed-tab--on { color: var(--text); font-weight: 600; }

.feed-tab--on::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 20px;
  height: 3px;
  border-radius: 2px;
  background: var(--primary);
}

.feed-count { font-size: 11px; color: var(--text3); }

.feed-label {
  display: flex;
  align-items: center;
  font-size: 12px;
  color: var(--text2);
  margin: 11px 0 9px;
}

.feed-label i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--sage);
  margin-right: 5px;
}

.feed-tip { font-size: 10.5px; color: var(--text3); text-align: center; margin-top: 6px; line-height: 1.6; }

.grid {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.grid-item { width: calc((100% - 12px) / 2); }

/* 双列饭卡 */
.mc {
  background: #fff;
  border: 1px solid var(--divider);
  border-radius: 12px;
  overflow: hidden;
}

.mc-media { position: relative; height: 126px; background: var(--apricot-soft); }
.mc-media-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mc-media-ph {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mc-media-ph span { font-size: 46px; line-height: 1; }

.mc-body { padding: 10px 10px 11px; }

.mc-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mc-amount { font-size: 15px; font-weight: 600; color: var(--primary); margin-top: 3px; }
.mc-amount--none { font-size: 12px; font-weight: 400; color: var(--text3); }

.mc-foot { display: flex; align-items: center; margin-top: 7px; }
.mc-author {
  font-size: 11px;
  color: var(--text2);
  margin-left: 5px;
  max-width: 64px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.mc-sep { font-size: 11px; color: var(--text3); margin: 0 3px; }
.mc-time { font-size: 11px; color: var(--text2); }

/* ---------------- 记一顿 ---------------- */
.field { margin-bottom: 18px; }
.field-label { font-size: 13px; color: var(--text2); margin-bottom: 7px; }

.input {
  width: 100%;
  min-height: 46px;
  background: #fff;
  border: 1px solid var(--divider);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 15px;
}

.input--ph { color: var(--text3); }
.input--area { min-height: 88px; line-height: 1.6; }
.counter { text-align: right; font-size: 11px; color: var(--text3); margin-top: 4px; }

.rec-time {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--primary-soft);
  margin: 11px 0 18px;
  font-size: 14px;
}

.rec-time span:first-child { font-size: 14px; }
.rec-time-text { flex: 1; color: var(--primary); font-weight: 500; margin-left: 6px; }
.rec-time-caret { color: var(--primary); }

.rec-images { display: flex; gap: 10px; margin-bottom: 18px; }

.rec-img {
  width: 100px;
  height: 100px;
  border-radius: 10px;
  border: 1px dashed var(--apricot);
  background: var(--apricot-soft);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.rec-img-plus { font-size: 23px; color: var(--primary); line-height: 1; }
.rec-img-label { font-size: 12px; color: var(--primary); margin-top: 5px; }
.rec-img-opt { font-size: 10px; color: var(--text3); margin-top: 2px; }

.rec-amount {
  display: flex;
  align-items: center;
  height: 46px;
  background: #fff;
  border: 1px solid var(--divider);
  border-radius: 10px;
  padding: 0 12px;
}

.rec-amount-sign { font-size: 16px; color: var(--primary); font-weight: 600; margin-right: 5px; }
.rec-amount-ph { flex: 1; color: var(--text3); font-size: 15px; }
.rec-amount-unknown {
  font-size: 12px;
  color: var(--text2);
  background: #F6F1EC;
  border-radius: 999px;
  padding: 5px 10px;
}

.rec-hint-inline { font-size: 10.5px; color: var(--text3); margin-top: 6px; line-height: 1.6; }

.rec-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 12px;
  background: #fff;
  border: 1px solid var(--divider);
  border-radius: 10px;
  margin-bottom: 10px;
  font-size: 14px;
}

.rec-row-left { display: flex; align-items: center; min-width: 0; gap: 6px; }
.rec-row-caret { color: var(--text3); margin-left: 6px; }
.rec-row-sum { font-size: 11px; color: var(--text3); }
.rec-hint { font-size: 10.5px; color: var(--text3); line-height: 1.7; margin: 6px 2px 16px; }

/* ---------------- 饭记详情 ---------------- */
.detail-hero {
  margin-top: 12px;
  width: 100%;
  height: 280px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.detail-hero-emoji { font-size: 100px; line-height: 1; }

.detail-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-top: 18px;
}

.detail-name { font-size: 22px; font-weight: 600; }
.detail-amount { font-size: 20px; font-weight: 600; color: var(--primary); }
.detail-meta { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
.detail-meta-time { font-size: 12px; color: var(--text2); }

.detail-author {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
}

.detail-author-name { font-size: 16px; font-weight: 600; }
.detail-author-sub { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
.detail-author-count { font-size: 11px; color: var(--text2); }

.detail-block { margin-top: 14px; padding: 14px; }
.detail-block-title { font-size: 12.5px; color: var(--text2); margin-bottom: 7px; }
.detail-block-body { font-size: 15px; line-height: 1.7; }
.detail-block-body--mood { color: #5A463A; }
.detail-block-note { font-size: 11px; color: var(--text3); margin-top: 6px; }
.detail-foot-tip { font-size: 10.5px; color: var(--text3); text-align: center; margin: 18px 4px 6px; line-height: 1.7; }

.actionbar--spacer { height: 74px; }

/* ---------------- 随机 ---------------- */
.rd-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0 2px;

/* ===== 交互层 ===== */
/* ============================================================
   可交互网页版 —— 设备外壳与交互层样式
   （内容区样式复用 preview.css，即小程序 app.wxss 的 1:2 映射）
   ============================================================ */

html, body { height: 100%; }

body.app-body {
  background:
    radial-gradient(1100px 620px at 50% -10%, #FFF1E2 0%, rgba(255, 241, 226, 0) 70%),
    #F4E9DC;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 22px 16px 40px;
}

/* ---------- 顶部演示工具条 ---------- */
.demo-bar {
  width: 100%;
  max-width: 1060px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin-bottom: 18px;
  padding: 12px 16px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid #E9DACB;
  backdrop-filter: blur(10px);
}

.demo-bar__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
}

.demo-bar__brand img { width: 30px; height: 30px; }

.demo-bar__hint {
  font-size: 12px;
  color: var(--text2);
  flex: 1;
  min-width: 200px;
  line-height: 1.6;
}

.demo-btn {
  font: inherit;
  font-size: 12.5px;
  color: #8A5A2B;
  background: #FFF1E5;
  border: 1px solid #F0D8C0;
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
  white-space: nowrap;
}

.demo-btn:hover { background: #FFE3CB; }
.demo-btn--ghost { background: #fff; color: var(--text2); border-color: var(--divider); }

/* ---------- 设备 ---------- */
.device {
  position: relative;
  width: 375px;
  height: 812px;
  border-radius: 44px;
  background: #3A2A20;
  padding: 10px;
  box-shadow:
    0 40px 80px -30px rgba(73, 53, 42, 0.45),
    0 0 0 1px rgba(255, 255, 255, 0.35) inset;
  flex-shrink: 0;
}

.device .phone {
  width: 100%;
  height: 100%;
  border-radius: 35px;
  border: none;
  box-shadow: none;
  overflow: hidden;
}

/* 顶部刘海 */
.device__notch {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 26px;
  background: #3A2A20;
  border-radius: 0 0 16px 16px;
  z-index: 6;
}

/* ---------- 导航栏（带返回） ---------- */
.navbar__back {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 19px;
  color: var(--text);
  cursor: pointer;
  line-height: 1;
  z-index: 4;
}

.navbar__back:active { background: rgba(73, 53, 42, 0.07); }
.navbar__right { font-size: 13px; color: var(--text2); z-index: 4; }
.navbar--plain { justify-content: flex-start; padding-left: 6px; }

/* 自定义导航页（首页）：内容自己留出胶囊空间 */
.screen--custom-nav { padding-top: 0; }

/* ---------- 通用交互件 ---------- */
.screen { scroll-behavior: smooth; }

.tap { cursor: pointer; }
.tap:active { opacity: 0.72; }

.btn { cursor: pointer; font-family: inherit; }
.btn:active { filter: brightness(0.96); }

/* 遮罩与底部面板复用 preview.css 的配色，这里补交互层 */
.overlay-layer {
  position: absolute;
  inset: 0;
  z-index: 15;
  pointer-events: none;
}

.overlay-layer > * { pointer-events: auto; }

.mask {
  position: absolute;
  inset: 0;
  background: rgba(73, 53, 42, 0.42);
  z-index: 20;
  animation: fade-in 180ms ease both;
}

.sheet-wrap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 21;
  max-height: 82%;
  overflow-y: auto;
  background: #fff;
  border-radius: 22px 22px 0 0;
  padding: 18px 16px 22px;
  animation: sheet-up 240ms cubic-bezier(0.22, 0.8, 0.3, 1) both;
}

.sheet-title { font-size: 16px; font-weight: 600; text-align: center; }
.sheet-desc {
  font-size: 12px;
  color: var(--text2);
  text-align: center;
  margin-top: 4px;
  margin-bottom: 14px;
  line-height: 1.6;
}
.sheet-close {
  text-align: center;
  color: var(--text2);
  font-size: 14px;
  padding: 14px 0 2px;
  cursor: pointer;
}
.sheet-btn { margin-top: 14px; }

@keyframes sheet-up {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Toast */
.toast {
  position: absolute;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%);
  max-width: 78%;
  background: rgba(73, 53, 42, 0.9);
  color: #fff;
  font-size: 13px;
  line-height: 1.5;
  padding: 10px 16px;
  border-radius: 10px;
  z-index: 40;
  text-align: center;
  animation: fade-in 140ms ease both;
}

.dialog {

/**
 * 通用格式化 / 时间计算工具
 * 全部使用「实际用餐时间」语义，不使用上传时间
 */
const { mealTypeByHour, LEVELS, FOOD_EMOJI } = require('./constants.js');

function pad(n) {
  return n < 10 ? '0' + n : '' + n;
}

/** 时间戳 → 2026-10-07 */
function dateKey(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/** 时间戳 → 12:30 */
function hhmm(ts) {
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/** 当天 00:00 的时间戳 */
function startOfDay(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

/** 相对日期前缀：今天 / 昨天 / 10月6日 */
function dayLabel(ts) {
  const today = startOfDay(Date.now());
  const target = startOfDay(ts);
  const diffDays = Math.round((today - target) / 86400000);
  if (diffDays === 0) return '今天';
  if (diffDays === 1) return '昨天';
  if (diffDays === 2) return '前天';
  if (diffDays === -1) return '明天';
  if (diffDays === -2) return '后天';
  const d = new Date(ts);
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

/** 饭卡/详情使用：今天 12:30 / 10月6日 12:08 */
function mealTimeLabel(ts) {
  return `${dayLabel(ts)} ${hhmm(ts)}`;
}

/** 仅短时间：12:30 */
function shortTime(ts) {
  return hhmm(ts);
}

/** 金额：18 → ¥18，18.5 → ¥18.5，1286 → ¥1,286 */
function money(n) {
  if (n === null || n === undefined || n === '') return '';
  const num = Number(n);
  if (isNaN(num)) return '';
  const isInt = Math.abs(num % 1) < 0.0001;
  const s = isInt ? String(num) : num.toFixed(2).replace(/0$/, '');
  const parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return '¥' + parts.join('.');
}

/** 千分位，不带符号 */
function thousands(n) {
  const num = Number(n) || 0;
  const isInt = Math.abs(num % 1) < 0.0001;
  const s = isInt ? String(num) : num.toFixed(2).replace(/0$/, '');
  const parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}

/** 当前时间对应的餐次 */
function currentMealType(ts) {
  const d = new Date(ts || Date.now());
  return mealTypeByHour(d.getHours());
}

/** 饭记数量 → 等级对象 */
function levelOf(count) {
  const c = count || 0;
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (c >= LEVELS[i].min) return LEVELS[i];
  }
  return LEVELS[0];
}

/** 距离展示：0.8km / 1.2km */
function distanceLabel(km) {
  if (km === null || km === undefined) return '';
  if (km < 1) return `${Math.round(km * 1000)}m`;
  return `${km.toFixed(1)}km`;
}

/** 名称 → 兜底食物 Emoji（无图饭记统一视觉） */
function foodEmoji(name) {
  const n = name || '';
  for (const item of FOOD_EMOJI) {
    for (const kw of item.kw) {
      if (n.indexOf(kw) > -1) return item.emoji;
    }
  }
  return '🍽️';
}

/** 名称 → 稳定的浅色渐变（用于无图卡片/头像底色） */
const PALETTE = [
  ['#FFD8B5', '#FFB980'],
  ['#A8C79D', '#8FB884'],
  ['#F59A86', '#EE7E68'],
  ['#F7C56B', '#EFAE3F'],
  ['#B9C7E8', '#97A9D6'],
  ['#E3B7D2', '#CF93BC']
];

function hashOf(str) {
  let h = 0;
  const s = String(str || '');
  for (let i = 0; i < s.length; i++) {
    h = (h * 31 + s.charCodeAt(i)) % 100000;
  }
  return h;
}

function avatarColors(seed) {
  const p = PALETTE[hashOf(seed) % PALETTE.length];
  return p;
}

/** 昵称 → 头像文字（取第一个字符） */
function avatarText(nickname) {
  const n = (nickname || '').trim();
  if (!n) return '饭';
  return n.slice(0, 1);
}

/** 生成今天/明天的日期 key */
function todayKey(offset) {
  return dateKey(Date.now() + (offset || 0) * 86400000);

  const first = new Date(year, month - 1, 1);

  const firstWeekday = first.getDay();
  const lead = firstWeekday === 0 ? 6 : firstWeekday - 1;
  return { first, days, lead };
}

  startOfDay,
  dayLabel,
  mealTimeLabel,
  shortTime,
  money,
  thousands,
  currentMealType,
  levelOf,
  distanceLabel,
  foodEmoji,
  avatarColors,
  avatarText,
  todayKey,

      .filter((m) => m.authorId === id && m.visibility === 'public')
      .sort((a, b) => b.eatenAt - a.eatenAt)[0];
    u.todayMeal = recent
      ? {
          text: `${F.dayLabel(recent.eatenAt)}${F.dayLabel(recent.eatenAt) === '今天' ? mealTypeLabel(recent.mealType) : ''}：${recent.name}`,
          name: recent.name,
          tone: F.dayLabel(recent.eatenAt) === '今天' ? 'primary' : 'muted'
        }
      : { text: '今天还没记录', name: '', tone: 'muted' };
    return u;
  }).filter(Boolean);
}

function isWished(mealId) {

/* ------------------------------------------------------------------ */
/* 饭记                                                                */
/* ------------------------------------------------------------------ */

function myMeals() {
  return db.meals.filter((m) => m.authorId === 'u_me');
}

/** 我可见的全部饭记（含他人公开/附近、我的全部） */
function visibleMeals() {
  return db.meals.filter((m) => {
    if (m.authorId === 'u_me') return true;
    return m.visibility === 'public' || m.visibility === 'nearby';
  });
}

function sortFeed(list, sort, currentType) {
  const arr = list.slice();
  if (sort === 'latest') {
    return arr.sort((a, b) => b.eatenAt - a.eatenAt);
  }
  if (sort === 'eat') {
    return arr.sort((a, b) => {
      if (b.eatCount !== a.eatCount) return b.eatCount - a.eatCount;
      return b.eatenAt - a.eatenAt;
    });
  }
  // 推荐：当前餐次 > 约 3km 距离 > 新鲜度 > 就吃这个次数
  const now = Date.now();
  return arr.sort((a, b) => score(b, now, currentType) - score(a, now, currentType));
}

function score(m, now, currentType) {
  let s = 0;
  if (m.mealType === currentType) s += 10000;

  const d = m.location ? m.location.distanceKm : null;
  if (d !== null && d !== undefined && d <= NEARBY_KM) {
    s += 3000 - Math.round(d * 300);
  }

  const hoursAgo = (now - m.eatenAt) / 3600000;
  s += Math.max(0, 2000 - Math.round(hoursAgo * 120));

  s += Math.min(m.eatCount || 0, 30) * 30;
  return s;
}

/**
 * 首页饭流
 * @param {object} opts { mealType, sort, windowHours }
 *
 * 只保留实时有效窗口内的饭记（默认 36 小时，见 constants.FEED_WINDOW_HOURS），
 * 避免几十天前的旧饭记混进「附近正在吃」。
 */
function getFeed(opts) {
  const o = opts || {};
  const sort = o.sort || 'recommend';
  const windowHours =
    o.windowHours === undefined ? C.FEED_WINDOW_HOURS : o.windowHours;
  const earliest = windowHours > 0 ? Date.now() - windowHours * 3600000 : 0;

  // 「完全不提供位置」的饭记不进入基于距离的附近推荐
  let list = visibleMeals().filter(
    (m) => !(sort === 'recommend' && m.location && m.location.provided === false)
  );
  if (earliest) {
    list = list.filter((m) => m.eatenAt >= earliest && m.eatenAt <= Date.now());
  }
  if (o.mealType) {
    list = list.filter((m) => m.mealType === o.mealType);
  }
  return sortFeed(list, sort, o.mealType || F.currentMealType()).map(decorateMeal);
}

/** 他人的饭流（作者主页用） */
function getMealsByAuthor(authorId, opts) {
  const o = opts || {};
  let list = db.meals.filter((m) => m.authorId === authorId);
  if (authorId !== 'u_me') {
    list = list.filter((m) => m.visibility === 'public');
  }
  if (o.mealType) list = list.filter((m) => m.mealType === o.mealType);
  if (o.dateKey) list = list.filter((m) => F.dateKey(m.eatenAt) === o.dateKey);
  list.sort((a, b) => b.eatenAt - a.eatenAt);
  return list.map(decorateMeal);
}

function dateText(key) {
  const parts = key.split('-');
  return `${Number(parts[1])}月${Number(parts[2])}日`;

function buildSlots(dateKey) {
  return C.MEAL_TYPES.map((t) => {
    const plan = db.plans.find((p) => p.date === dateKey && p.mealType === t.key && p.status !== 'cancelled');
    // 「已吃」的餐位要关联到真实饭记

      meal = db.meals.find(
        (m) => m.authorId === 'u_me' && m.mealType === t.key && F.dateKey(m.eatenAt) === dateKey
      );
    }
    const c = F.avatarColors(plan ? plan.name : t.key);
    return {
      mealType: t.key,
      mealTypeLabel: t.label,
      emoji: t.emoji,
      hasPlan: !!plan,
      planId: plan ? plan.id : '',
      name: plan ? plan.name : '',
      status: plan ? plan.status : 'none',
      statusLabel: plan ? C.PLAN_STATUS[plan.status] : '未安排',
      sourceType: plan ? plan.sourceType : '',
      sourceText: plan && plan.sourceType === 'meal' && plan.sourceUserName ? `来自 @${plan.sourceUserName}` : plan && plan.sourceType === 'wish' ? '来自我的想吃' : '',
      referenceAmountText: plan && plan.referenceAmount ? '约 ' + F.money(plan.referenceAmount) : '',
      mealId: meal ? meal.id : '',
      grad1: c[0],
      grad2: c[1],
      foodEmoji: F.foodEmoji(plan ? plan.name : '')
    };
  });

function addPlan(input) {
  const date = input.date || F.todayKey(0);
  const exist = db.plans.find(
    (p) => p.date === date && p.mealType === input.mealType && p.status !== 'cancelled'
  );
  if (exist) {
    Object.assign(exist, {
      name: input.name,
      referenceAmount: input.referenceAmount || null,
      sourceType: input.sourceType || 'manual',
      sourceId: input.sourceId || '',
      sourceUserName: input.sourceUserName || '',
      status: 'planned'
    });
  } else {
    db.plans.push({
      id: 'p_' + Date.now(),
      userId: 'u_me',
      date,
      mealType: input.mealType,
      sourceType: input.sourceType || 'manual',
      sourceId: input.sourceId || '',
      sourceUserName: input.sourceUserName || '',
      name: input.name,
      referenceAmount: input.referenceAmount || null,
      status: 'planned',
      createdAt: Date.now()
    });
  }
  flush();
}

function cancelPlan(planId) {
  const p = db.plans.find((x) => x.id === planId);
  if (p) {

    flush();

function completePlan(planId) {

/* 我的饭历                                                            */

/** 某月所有「真实吃过」的饭记，按日期分组 */
function getCalendarMonth(year, month) {
  const prefix = `${year}-${F.pad(month)}`;
  const list = db.meals
    .filter((m) => m.authorId === 'u_me' && F.dateKey(m.eatenAt).indexOf(prefix) === 0)
    .sort((a, b) => a.eatenAt - b.eatenAt);

  const byDay = {};
  let total = 0;
  let count = 0;
  list.forEach((m) => {
    const k = F.dateKey(m.eatenAt);
    if (!byDay[k]) byDay[k] = { dateKey: k, meals: [], total: 0, count: 0, hasAmountUnknown: false };
    byDay[k].meals.push(decorateMeal(m));
    byDay[k].count += 1;
    count += 1;
    if (m.amount !== null && m.amount !== undefined && !m.amountUnknown) {
      byDay[k].total += Number(m.amount);
      total += Number(m.amount);
    } else {
      byDay[k].hasAmountUnknown = true;
    }
  });

  Object.keys(byDay).forEach((k) => {
    byDay[k].totalText = F.money(byDay[k].total);
    byDay[k].byType = C.MEAL_TYPES.map((t) => {
      const m = byDay[k].meals.find((x) => x.mealType === t.key);
      return { label: t.label, emoji: t.emoji, meal: m || null };
    });
  });

  return { byDay, total, count, totalText: F.money(total) };
}

/* ------------------------------------------------------------------ */
/* 消费统计                                                            */
/* ------------------------------------------------------------------ */

function statsRange(period) {
  const now = new Date();
  let from;
  let label;
  if (period === 'week') {
    const day = now.getDay() === 0 ? 7 : now.getDay();
    from = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + 1, 0, 0, 0, 0);
    label = '本周';
  } else if (period === 'year') {
    from = new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0);
    label = now.getFullYear() + '年';
  } else {
    from = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
    label = `${now.getFullYear()}年${now.getMonth() + 1}月`;
  }
  return { from: from.getTime(), to: Date.now() + 1, label };
}

function getStats(period) {
  const key = period || 'month';
  const range = statsRange(key);
  const list = db.meals.filter(
    (m) =>
      m.authorId === 'u_me' &&
      m.eatenAt >= range.from &&
      m.eatenAt < range.to &&
      m.amount !== null &&
      m.amount !== undefined &&
      !m.amountUnknown
  );

  let total = 0;
  const buckets = {};
  const byType = { breakfast: 0, lunch: 0, dinner: 0 };
  const typeCount = { breakfast: 0, lunch: 0, dinner: 0 };

  list.forEach((m) => {
    const amt = Number(m.amount);
    total += amt;
    byType[m.mealType] += amt;
    typeCount[m.mealType] += 1;

    let bucketKey;
    if (key === 'year') {
      bucketKey = String(new Date(m.eatenAt).getMonth() + 1);
    } else if (key === 'month') {
      bucketKey = String(new Date(m.eatenAt).getDate());
    } else {
      bucketKey = ['一', '二', '三', '四', '五', '六', '日'][new Date(m.eatenAt).getDay() === 0 ? 6 : new Date(m.eatenAt).getDay() - 1];
    }
    if (!buckets[bucketKey]) buckets[bucketKey] = { label: bucketKey, value: 0, count: 0 };
    buckets[bucketKey].value += amt;
    buckets[bucketKey].count += 1;
  });

  // 按维度排序并补齐空桶
  const trend = buildTrend(key, buckets, range);
  const maxValue = trend.reduce((m, x) => Math.max(m, x.value), 0);

  const types = C.MEAL_TYPES.map((t) => ({
    key: t.key,
    label: t.label,
    emoji: t.emoji,
    value: Math.round(byType[t.key] * 100) / 100,
    valueText: F.money(Math.round(byType[t.key] * 100) / 100),
    count: typeCount[t.key],
    percent: total > 0 ? Math.round((byType[t.key] / total) * 100) : 0
  }));

  return {
    period: key,
    label: range.label,
    total: Math.round(total * 100) / 100,
    totalText: F.money(Math.round(total * 100) / 100),
    count: list.length,
    avgText: list.length ? F.money(Math.round((total / list.length) * 100) / 100) : F.money(0),
    trend: trend.map((x) => Object.assign({}, x, { percent: maxValue > 0 ? Math.round((x.value / maxValue) * 100) : 0 })),
    types,
    maxValue,
    hasData: list.length > 0
  };
}

function buildTrend(key, buckets, range) {
  const out = [];
  const now = new Date();

  if (key === 'week') {
    const labels = ['一', '二', '三', '四', '五', '六', '日'];
    const day = now.getDay() === 0 ? 7 : now.getDay();
    for (let i = 0; i < day; i++) {
      const b = buckets[labels[i]] || { value: 0, count: 0 };
      out.push({ label: labels[i], value: b.value, count: b.count });
    }
  } else if (key === 'month') {
    const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const today = now.getDate();
    for (let i = 1; i <= today; i++) {
      const b = buckets[String(i)] || { value: 0, count: 0 };
      // 刻度只标 1 号、整五日和今天，避免 30 个标签挤在一起
      out.push({ label: i === 1 || i % 5 === 0 || i === today ? String(i) : '', value: b.value, count: b.count });
    }
    void days;
  } else {
    for (let i = 1; i <= 12; i++) {
      const b = buckets[String(i)] || { value: 0, count: 0 };
      out.push({ label: i + '月', value: b.value, count: b.count });
    }
  }
  return out;
}

/** 「我的」页今日状态 */
function getTodaySummary() {
  const key = F.todayKey(0);
  const list = db.meals.filter((m) => m.authorId === 'u_me' && F.dateKey(m.eatenAt) === key);
  let total = 0;
  list.forEach((m) => {
    if (m.amount !== null && m.amount !== undefined && !m.amountUnknown) total += Number(m.amount);
  });
  const types = list.map((m) => m.mealType);
  const pending = C.MEAL_TYPES.filter((t) => types.indexOf(t.key) === -1).map((t) => t.label);

  // 今天三餐的轻量状态卡
  const slots = C.MEAL_TYPES.map((t) => {
    const m = list.filter((x) => x.mealType === t.key).sort((a, b) => b.eatenAt - a.eatenAt)[0];
    const d = m ? decorateMeal(m) : null;
    return {
      mealType: t.key,
      label: t.label,
      emoji: t.emoji,
      recorded: !!d,
      name: d ? d.name : '还没记',
      amountText: d ? (d.amountKnown ? d.amountText : '未记金额') : ''
    };
  });

  const monthStats = getStats('month');

  return {
    count: list.length,
    total,
    totalText: F.money(total),
    pendingText: pending.length ? pending.join(' / ') + '还没记' : '今天三餐都记好啦',
    slots,
    monthTotalText: monthStats.totalText,
    level: getUser('u_me')
  };
}

/* ------------------------------------------------------------------ */
/* 随机帮我选                                                          */
/* ------------------------------------------------------------------ */

let recentRandom = [];

function randomNearby(mealType) {
  const type = mealType || F.currentMealType();
  const nearestPool = (hours) =>
    visibleMeals().filter(
      (m) =>
        m.mealType === type &&
        m.location &&
        m.location.provided !== false &&
        m.location.distanceKm !== null &&
        m.location.distanceKm !== undefined &&
        m.location.distanceKm <= NEARBY_KM &&
        m.authorId !== 'u_me' &&
        m.eatenAt <= Date.now() &&
        m.eatenAt >= Date.now() - hours * 3600000
    );

  // 优先「今天大家正在吃」；今天这个餐次还没人记时，退回到最近 36 小时
  let pool = nearestPool(24);
  if (!pool.length) pool = nearestPool(C.FEED_WINDOW_HOURS);
  if (!pool.length) return null;

  const fresh = pool.filter((m) => recentRandom.indexOf(m.id) === -1);
  const use = fresh.length ? fresh : pool;
  const picked = use[Math.floor(Math.random() * use.length)];
  recentRandom.push(picked.id);
  if (recentRandom.length > 5) recentRandom.shift();
  return decorateMeal(picked);
}

function randomWish() {
  const list = db.wishes.filter((w) => w.status === 'want');
  if (!list.length) return null;
  const fresh = list.filter((w) => recentRandom.indexOf(w.id) === -1);
  const use = fresh.length ? fresh : list;
  const picked = use[Math.floor(Math.random() * use.length)];
  recentRandom.push(picked.id);
  if (recentRandom.length > 5) recentRandom.shift();
  return decorateWish(picked);
}

const esc = (s) =>

function avatar(u, cls) {
  if (!u) return '';
  const inner = u.hasAvatarImage
    ? `<img class="ava-img" src="${esc(u.avatarUrl)}" alt="">`
    : esc(u.avatarDisplay);
  return `<div class="ava ${cls || ''}" style="background:linear-gradient(140deg,${u.avatarColor1} 0%,${u.avatarColor2} 100%)">${inner}</div>`;

function hasPhoto(m) {
  return !!SESSION_IMAGES[m.id] || m.hasImage;

/* ---------------- 饭卡（与小程序 meal-card 组件一一对应） ---------------- */

    : `<div class="mc-media-ph" style="${grad(m)}"><span>${esc(m.emoji)}</span></div>`;
  const foot =

/* 就吃这个 / 安排到餐单 的餐次选项（只显示当前仍有意义的餐次） */
function buildPlanOptions() {
  const h = new Date().getHours();
  const todayMeaningful = { breakfast: h < 11, lunch: h < 16, dinner: true };
  const groups = [
    { label: '今天', dateKey: F.todayKey(0), filter: todayMeaningful },
    { label: '明天', dateKey: F.todayKey(1), filter: { breakfast: true, lunch: true, dinner: true } }
  ];
  const plans = store.getPlans(F.todayKey(0)).concat(store.getPlans(F.todayKey(1)));
  return groups
    .map((g) => ({
      label: g.label,
      dateKey: g.dateKey,
      slots: C.MEAL_TYPES.filter((t) => g.filter[t.key]).map((t) => {
        const exist = plans.find((p) => p.date === g.dateKey && p.mealType === t.key);
        return { mealType: t.key, label: t.label, emoji: t.emoji, taken: !!exist, takenText: exist ? exist.name : '' };
      })
    }))
    .filter((g) => g.slots.length);
}

function planSheetHtml() {
  if (!S.planSheet) return '';
  const t = S.planSheet;
  const opts = buildPlanOptions();
  return `<div class="mask" data-act="close-sheet"></div>
  <div class="sheet-wrap">
    <div class="sheet-title">${esc(t.title)}</div>
    <div class="sheet-desc">${esc(t.desc)}</div>
    ${opts
      .map(
        (g) => `<div class="plan-group">
      <div class="plan-group__label">${g.label}</div>
      <div class="plan-slots">${g.slots
        .map(
          (s) => `<div class="plan-slot ${s.taken ? 'plan-slot--taken' : ''}" data-act="pick-plan" data-type="${s.mealType}" data-date="${g.dateKey}">
        <span class="plan-slot__emoji">${s.emoji}</span>
        <span class="plan-slot__label">${s.label}</span>
        ${s.taken ? `<span class="plan-slot__taken">已安排</span>` : ''}

    </div>`

      .join('')}
    <div class="sheet-close" data-act="close-sheet">取消</div>

}

        <div style="display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--divider)">
          ${
            isWish
              ? `<div class="grow"><div style="font-size:14px;font-weight:500">${esc(res.placeName || res.areaName || '没写地点')}</div>
                 <div style="font-size:11px;color:var(--text2);margin-top:2px">${esc(res.note || '来自我的想吃')}</div></div>`
              : `${avatar(res.author, 'ava-sm')}
                 <div class="grow"><div style="font-size:14px;font-weight:500">${esc(res.authorName)}</div>
                 <div style="font-size:11px;color:var(--text2);margin-top:2px">${esc(res.timeLabel)}</div></div>
                 <span class="tap" style="font-size:12px;color:var(--primary)" data-act="open-meal" data-id="${res.id}">看这一顿 ›</span>`
          }
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:15px" data-act="random-plan">${isWish ? '安排到餐单' : '就吃这个'}</button>
        <div class="tap" style="text-align:center;font-size:14px;color:var(--text2);padding:13px 0 2px" data-act="random-roll">换一个</div>
      </div>
      <div style="font-size:10.5px;color:var(--text3);text-align:center;line-height:1.7;margin-top:18px">抽到的都是当前餐次、附近约 3km 内、大家今天真实吃过的饭。短时间内不会重复抽到同一条。</div>`;
    } else {
      body += `<div class="empty">
        <img class="empty__img" src="../assets/logo_main.png" alt="">
        <div class="empty__text">${r.source === 'wish' ? '你的想吃清单还是空的' : '这个餐次附近暂时没有可抽的饭记'}</div>
        <div class="empty__text">${r.source === 'wish' ? '先去记一个想吃的吧' : '换个餐次，或者晚点再来看看'}</div>
        <div class="empty__acts">${
          r.source === 'wish'
            ? `<button class="btn btn-primary btn-sm" data-act="go-wish-add">去记一个想吃的</button>`
            : `<button class="btn btn-ghost btn-sm" data-act="random-back">换个来源</button>`
        }</div>
      </div>`;
    }
  }

  return { title: '随机帮我选', body: `<div class="screen-body" style="padding:4px 0 28px">${body}</div>` };
}

/* =====================================================================
   6. 记一顿
   ===================================================================== */
function ensureRecordForm() {
  if (S.record) return S.record;
  const n = Date.now();
  S.record = {
    mealType: F.currentMealType(n),
    dateStr: F.dateKey(n),
    timeStr: F.hhmm(n),
    name: '',
    amount: '',
    amountUnknown: false,
    images: [],
    moodText: '',
    locMode: 'fuzzy',
    placeName: '',
    visibility: 'public',
    moodVisibility: 'public',
    settingsOpen: false,
    draftPlanId: '',
    timeSheet: false,
    locSheet: false
  };
  return S.record;
}

function screenRecord() {
  const d = ensureRecordForm();
  const me = store.getRawMe();
  const timeSummary = `${d.dateStr === F.todayKey(0) ? '今天' : d.dateStr.slice(5).replace('-', '月') + '日'} ${d.timeStr}`;
  const locText = {
    exact: d.placeName || '已关联当前位置',
    fuzzy: `已关联 ${me.region || C.DEFAULT_REGION.name}`,
    hidden: '已关联位置 · 不公开',
    none: '不使用位置'
  }[d.locMode];
  const publishSummary = `${(C.MEAL_VISIBILITY.find((x) => x.key === d.visibility) || {}).label} · ${
    (C.LOCATION_VISIBILITY.find((x) => x.key === d.locMode) || {}).label || '不使用位置'
  } · ${(C.MOOD_VISIBILITY.find((x) => x.key === d.moodVisibility) || {}).label}感受`;

  const body = `<div class="meal-tabs meal-tabs--seg" style="margin-top:12px">
      ${C.MEAL_TYPES.map((t) => `<div class="meal-tab ${d.mealType === t.key ? 'meal-tab--on' : ''}" data-act="rec-meal" data-key="${t.key}">${t.label}</div>`).join('')}
    </div>
    <div class="rec-time tap" data-act="rec-open-time" style="margin-top:11px">
      <span>🕒</span><span class="rec-time-text">${timeSummary}</span><span class="rec-time-caret">›</span>
    </div>

    <div class="field">
      <div class="field-label">今天吃了什么？</div>
      <div class="field-box"><input class="ipt" id="rec-name" maxlength="20" placeholder="例如：番茄肥牛饭" value="${esc(d.name)}"></div>
    </div>

    <div class="rec-images" style="margin-bottom:18px">
      ${d.images
        .map(
          (src, i) => `<div class="rec-img" style="background:none;border:1px solid var(--divider);overflow:hidden">
        <img src="${esc(src)}" style="width:100%;height:100%;object-fit:cover" alt="">
        <div class="tap" data-act="rec-remove-img" data-i="${i}" style="position:absolute;right:0;top:0;width:23px;height:23px;background:rgba(73,53,42,.55);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border-bottom-left-radius:10px">✕</div>
      </div>`
        )
        .join('')}
      ${d.images.length < 3 ? `<div class="rec-img tap" data-act="rec-add-img">
        <span class="rec-img-plus">＋</span><span class="rec-img-label">添加照片</span><span class="rec-img-opt">（可选）</span>
      </div>` : ''}
    </div>

    <div class="field">
      <div class="field-label">金额</div>
      <div class="rec-amount" style="${d.amountUnknown ? 'opacity:.6' : ''}">
        <span class="rec-amount-sign">¥</span>
        <input class="ipt" id="rec-amount" type="text" inputmode="decimal" placeholder="例如 22" value="${esc(d.amount)}" ${d.amountUnknown ? 'disabled' : ''}>
        <div class="tap rec-amount-unknown ${d.amountUnknown ? 'rec-amount-unknown--on' : ''}" data-act="rec-amount-unknown">${d.amountUnknown ? '✓ ' : ''}不记金额</div>
      </div>
      <div class="rec-hint-inline">填了金额，就能自动生成你的周 / 月 / 年吃饭消费总结。</div>
    </div>

    <div class="field">
      <div class="field-label">今天这顿感觉怎么样？（可选）</div>
      <div class="field-box field-box--area">
        <textarea class="ipt" id="rec-mood" maxlength="50" placeholder="写一句也行，不写也行……">${esc(d.moodText)}</textarea>
      </div>
      <div class="counter"><span id="mood-count">${d.moodText.length}</span>/50</div>
    </div>

    <div class="rec-row tap" data-act="rec-open-loc">
      <div class="rec-row-left"><span>📍</span><span style="${d.locMode === 'none' ? 'color:var(--text2)' : ''}">${esc(locText)}</span></div>
      <span class="rec-row-caret">›</span>
    </div>

    <div style="margin-bottom:10px">
      <div class="rec-row tap" data-act="rec-toggle-settings" style="margin-bottom:0;${d.settingsOpen ? 'border-radius:10px 10px 0 0' : ''}">
        <div class="rec-row-left"><span>⚙️</span><span>发布设置</span></div>
        <div class="rec-row-left"><span class="rec-row-sum">${esc(publishSummary)}</span><span class="rec-row-caret">${d.settingsOpen ? '⌃' : '›'}</span></div>
      </div>
      ${
        d.settingsOpen
          ? `<div style="background:#fff;border:1px solid var(--divider);border-top:none;border-radius:0 0 10px 10px;padding:14px 12px">
        <div class="perm" style="margin-bottom:14px">
          <div class="perm__label" style="font-size:12.5px;color:var(--text2);margin-bottom:8px">饭记可见范围</div>
          <div class="chips">${C.MEAL_VISIBILITY.map((o) => `<div class="chip ${d.visibility === o.key ? 'chip--on' : ''}" data-act="rec-vis" data-key="${o.key}">${o.label}</div>`).join('')}</div>
        </div>
        <div class="perm" style="margin-bottom:14px">
          <div class="perm__label" style="font-size:12.5px;color:var(--text2);margin-bottom:8px">地点可见范围</div>
          <div class="chips">
            ${C.LOCATION_VISIBILITY.map((o) => `<div class="chip ${d.locMode === o.key ? 'chip--on' : ''}" data-act="rec-locmode" data-key="${o.key}">${o.label}</div>`).join('')}
            <div class="chip ${d.locMode === 'none' ? 'chip--on' : ''}" data-act="rec-locmode" data-key="none">不使用位置</div>
          </div>
        </div>
        <div class="perm">
          <div class="perm__label" style="font-size:12.5px;color:var(--text2);margin-bottom:8px">感受可见范围</div>
          <div class="chips">${C.MOOD_VISIBILITY.map((o) => `<div class="chip ${d.moodVisibility === o.key ? 'chip--on' : ''}" data-act="rec-moodvis" data-key="${o.key}">${o.label}</div>`).join('')}</div>
        </div>
        <div style="font-size:10.5px;color:var(--text3);margin-top:12px;line-height:1.6">三类权限相互独立：饭记公开不会连带公开你的地点和感受。</div>
      </div>`
          : ''
      }
    </div>

    <div style="font-size:10.5px;color:var(--text3);line-height:1.7;margin:6px 2px 16px">饭流、饭历和消费统计都按你填的「实际用餐时间」归档，所以晚上也能补记中午那一顿。</div>
    <button class="btn btn-primary btn-block" data-act="rec-submit">记下这一顿</button>`;

  let extra = '';
  if (d.timeSheet) {
    extra += `<div class="mask" data-act="close-sheet"></div><div class="sheet-wrap">
      <div class="sheet-title">这一顿是什么时候吃的</div>
      <div class="sheet-desc">系统按实际用餐时间归档，不是上传时间</div>
      <div class="pick-row"><span class="pick-row__k">日期</span>
        <input class="ipt" type="date" id="rec-date" value="${d.dateStr}" style="width:150px;text-align:right;font-size:15px">
      </div>
      <div class="pick-row"><span class="pick-row__k">时间</span>
        <input class="ipt" type="time" id="rec-time" value="${d.timeStr}" style="width:150px;text-align:right;font-size:15px">
      </div>
      <div class="pick-row" style="border-bottom:none"><span class="pick-row__k">餐次</span>
        <span class="pick-row__v">${(C.MEAL_TYPES.find((t) => t.key === d.mealType) || {}).label}（自动判断，可上面切换）</span>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:14px" data-act="rec-confirm-time">确定</button>
    </div>`;
  }
  if (d.locSheet) {
    const opts = [
      ['exact', '具体地点', '显示食堂 / 店铺名称'],
      ['fuzzy', '模糊区域', `只显示「${me.region || C.DEFAULT_REGION.name}」这一级`],
      ['hidden', '不公开', '别人看不到地点，但仍可参与附近匹配'],
      ['none', '不使用位置', '这顿不进入基于距离的附近饭流']
    ];
    extra += `<div class="mask" data-act="close-sheet"></div><div class="sheet-wrap">
      <div class="sheet-title">这一顿的位置</div>
      <div class="sheet-desc">系统用它做附近匹配，和「对外公开多少」是两件事</div>
      ${opts
        .map(
          ([k, n, de]) => `<div class="loc-opt ${d.locMode === k ? 'loc-opt--on' : ''}" data-act="rec-pick-loc" data-key="${k}">
        <div><div class="loc-opt__name">${n}</div><div class="loc-opt__desc">${esc(de)}</div></div>
        <span class="loc-opt__check">${d.locMode === k ? '✓' : ''}</span>
      </div>`
        )
        .join('')}
      ${
        d.locMode === 'exact'
          ? `<input class="ipt field-box" id="rec-place" style="margin-top:8px;border:1px solid var(--divider);border-radius:10px;padding:12px 14px;font-size:15px" placeholder="写一下具体店名 / 食堂（可选）" value="${esc(d.placeName)}">`
          : ''
      }
      <button class="btn btn-primary btn-block" style="margin-top:14px" data-act="close-sheet">确定</button>
    </div>`;
  }

  return { title: '记一顿', tab: 'record', body: `<div class="screen-body" style="padding:0 0 28px">${body}</div>`, extra };
}

/* =====================================================================
   7. 饭记详情
   ===================================================================== */
function screenMealDetail(p) {
  const m = store.getMealById(p.id);
  if (!m) return { title: '这一顿', body: '<div class="empty"><div class="empty__text">这条饭记不见了</div></div>' };
  const isMine = m.authorId === 'u_me';
  const isSaved = store.isWished(m.id);
  const loc = m.location || {};

  let placeLine = '';
  if (loc.displayMode === 'exact') placeLine = loc.placeName || loc.areaName || '';
  else if (loc.displayMode === 'fuzzy') placeLine = (loc.areaName || '附近') + ' · 只显示大概区域';
  else if (loc.provided) placeLine = '附近 · 位置未公开';

  const moodLine = m.moodText && (m.moodVisibility === 'public' || isMine) ? m.moodText : '';

  const body = `
    <div style="padding-top:12px">
      ${
        hasPhoto(m)
          ? `<img src="${esc(coverOf(m))}" style="width:100%;height:280px;border-radius:14px;object-fit:cover;display:block" alt="">`
          : `<div style="width:100%;height:280px;border-radius:14px;display:flex;align-items:center;justify-content:center;${grad(m)}"><span style="font-size:100px;line-height:1">${esc(m.emoji)}</span></div>`
      }
    </div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:18px">
      <div style="font-size:22px;font-weight:600">${esc(m.name)}</div>
      <div style="font-size:20px;font-weight:600;color:var(--primary);${m.amountKnown ? '' : 'font-size:13px;font-weight:400;color:var(--text3)'}">${esc(m.amountText)}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
      <span class="tag tag-soft">${esc(m.mealTypeLabel)}</span>
      <span style="font-size:12px;color:var(--text2)">${esc(m.timeLabel)}</span>
    </div>

    <div class="tap card" data-act="open-author" data-id="${m.authorId}" style="display:flex;align-items:center;gap:10px;margin-top:18px">
      ${avatar(m.author, 'ava-md')}
      <div class="grow">
        <div style="font-size:16px;font-weight:600">${esc(m.authorName)}</div>
        <div style="display:flex;align-items:center;gap:7px;margin-top:4px">
          <span class="level">${esc(m.author.levelText)}</span>
          <span style="font-size:11px;color:var(--text2)">已记录 ${m.author.recordCount} 顿</span>
        </div>
      </div>
      <span class="cell-arrow">›</span>
    </div>

    ${
      placeLine
        ? `<div class="card" style="margin-top:14px;padding:14px">
      <div style="font-size:12.5px;color:var(--text2);margin-bottom:7px">📍 在哪儿吃的</div>
      <div style="font-size:15px;line-height:1.7">${esc(placeLine)}</div>
      ${m.distanceText ? `<div style="font-size:11px;color:var(--text3);margin-top:6px">距你约 ${esc(m.distanceText)}</div>` : ''}
    </div>`
        : ''
    }

    ${
      moodLine
        ? `<div class="card" style="margin-top:14px;padding:14px">
      <div style="font-size:12.5px;color:var(--text2);margin-bottom:7px">吃这一顿的时候</div>
      <div style="font-size:15px;line-height:1.7;color:#5A463A">${esc(moodLine)}</div>
    </div>`
        : ''
    }

    ${
      !placeLine && !moodLine
        ? `<div style="margin-top:14px;padding:14px;border:1px dashed var(--divider);border-radius:12px;font-size:12.5px;color:var(--text3);line-height:1.7">作者没有公开地点和感受，只留下了这一顿本身。</div>`
        : ''
    }

    <div style="font-size:10.5px;color:var(--text3);text-align:center;margin:18px 4px 6px;line-height:1.7">这里不显示点赞、评论和粉丝数。觉得不错，就默默吃一顿一样的。</div>
    <div style="height:74px"></div>`;

  const bar = isMine
    ? `<div style="position:absolute;left:0;right:0;bottom:0;padding:10px 16px 18px;background:rgba(255,248,241,.94);border-top:1px solid var(--divider);display:flex;align-items:center;justify-content:space-between;z-index:9">
      <span class="tag tag-sage">这是你记下的一顿</span>
      <span style="font-size:12px;color:var(--text2)">${esc(m.timeLabel)}</span>
    </div>`
    : `<div style="position:absolute;left:0;right:0;bottom:0;padding:10px 16px 18px;background:rgba(255,248,241,.94);border-top:1px solid var(--divider);display:flex;align-items:center;gap:10px;z-index:9">
      <div class="tap" data-act="toggle-save" data-id="${m.id}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:70px;height:44px;border-radius:22px;border:1px solid ${isSaved ? 'var(--apricot)' : 'var(--divider)'};background:${isSaved ? 'var(--apricot-soft)' : '#fff'}">
        <span style="font-size:15px;line-height:1;color:${isSaved ? 'var(--primary)' : 'var(--text2)'}">${isSaved ? '♥' : '♡'}</span>
        <span style="font-size:10px;color:${isSaved ? 'var(--primary)' : 'var(--text2)'};margin-top:2px">${isSaved ? '已收藏' : '收藏'}</span>
      </div>
      <button class="btn btn-primary grow" data-act="open-plan-sheet" data-id="${m.id}" data-name="${esc(m.name)}" data-author="${esc(m.authorName)}">就吃这个</button>
    </div>`;

  return { title: m.name, body: `<div class="screen-body" style="padding:0 16px 0">${body}</div>`, fixedBottom: bar };
}

/* =====================================================================
   8. 作者个人主页
   ===================================================================== */
function screenAuthor(p) {
  const user = store.getUser(p.id);
  if (!user) return { title: '吃饭档案', body: '<div class="empty"><div class="empty__text">找不到这个人</div></div>' };
  const isMe = p.id === 'u_me';
  const following = !isMe && store.isFollowing(p.id);
  const todayMeals = store.getMealsByAuthor(p.id, { dateKey: F.todayKey(0) });
  const recent = store.getMealsByAuthor(p.id).slice(0, 12);

  const body = `<div class="card" style="margin-top:12px;padding:16px 14px">
    <div style="display:flex;align-items:center;gap:13px">
      ${avatar(user, 'ava-xl')}
      <div class="grow">
        <div style="font-size:19px;font-weight:600">${esc(user.nickname)}</div>
        <div style="display:flex;align-items:center;gap:7px;margin-top:6px">
          <span class="level">${esc(user.levelText)}</span>
          <span style="font-size:11px;color:var(--text2)">已记录 ${user.recordCount} 顿</span>
        </div>
        ${user.bio ? `<div style="font-size:11.5px;color:var(--text2);margin-top:6px;line-height:1.6">${esc(user.bio)}</div>` : ''}
      </div>
    </div>
    ${
      isMe
        ? `<div style="margin-top:15px;height:44px;line-height:44px;border-radius:22px;background:var(--sage-soft);color:#5C7A52;text-align:center;font-size:14px">这是你自己的吃饭档案</div>`
        : `<button class="btn btn-block ${following ? 'btn-sage' : 'btn-primary'}" style="margin-top:15px" data-act="toggle-follow" data-id="${p.id}">${following ? '已跟吃 ✓' : '跟吃 TA'}</button>`
    }
    <div style="font-size:10.5px;color:var(--text3);text-align:center;margin-top:8px">${isMe ? '想回看更久以前，去「我的饭历」' : '以后多看看 TA 都吃些什么'}</div>
  </div>

  <div class="section">
    <div class="section-head"><span class="section-title">今天吃了什么</span></div>
    <div class="card" style="padding:0 12px">
      ${C.MEAL_TYPES.map((t) => {
        const hit = todayMeals.find((m) => m.mealType === t.key);
        return `<div class="${hit ? 'tap ' : ''}au-today-row" ${hit ? `data-act="open-meal" data-id="${hit.id}"` : ''}>
          <div class="au-today-left"><span>${t.emoji}</span><span class="au-today-label">${t.label}</span></div>
          <div class="au-today-right">${
            hit
              ? `<span class="au-today-name">${esc(hit.name)}</span><span class="au-today-amount">${esc(hit.amountText)}</span><span class="cell-arrow">›</span>`
              : `<span class="au-today-none">还没记录</span>`
          }</div>
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="section">
    <div class="section-head"><span class="section-title">最近吃过</span><span class="section-more">共 ${user.recordCount} 顿</span></div>
    ${recent.length ? mealGrid(recent, 'author') : '<div class="empty"><div class="empty__text">还没有记录</div></div>'}
  </div>

  <div style="font-size:10.5px;color:var(--text3);text-align:center;margin:22px 4px 10px;line-height:1.7">不显示粉丝数，也不做点赞竞争。这里只是一个吃饭档案。</div>`;

  return { title: user.nickname, body: `<div class="screen-body" style="padding:0 16px 28px">${body}</div>` };
}

   9. 我的

    ['calendar', '🗓', '我的饭历', '回看已经真实吃过的饭'],

  ];
  const body = `<div class="card" style="display:flex;align-items:center;gap:12px;margin-top:12px">

/* =====================================================================
   10. 我的饭历
   ===================================================================== */
function ensureCalendar() {
  if (S.calendar) return S.calendar;
  const n = new Date();
  S.calendar = { year: n.getFullYear(), month: n.getMonth() + 1, selectedKey: F.todayKey(0) };
  return S.calendar;
}

function screenCalendar() {
  const cs = ensureCalendar();
  const r = store.getCalendarMonth(cs.year, cs.month);
  const mi = F.monthInfo(cs.year, cs.month);
  const cells = [];
  for (let i = 0; i < mi.lead; i++) cells.push({ empty: true });
  for (let d = 1; d <= mi.days; d++) {
    const key = `${cs.year}-${F.pad(cs.month)}-${F.pad(d)}`;
    cells.push({ empty: false, day: d, key, has: !!r.byDay[key], today: key === F.todayKey(0) });
  }
  while (cells.length % 7 !== 0) cells.push({ empty: true });

  // 保证选中日期一定落在当前展示月份内（切换月份后不能沿用上个月的 key）
  const monthPrefix = `${cs.year}-${F.pad(cs.month)}-`;
  if (!cs.selectedKey || cs.selectedKey.indexOf(monthPrefix) !== 0) {
    const withRecord = Object.keys(r.byDay).sort();
    cs.selectedKey = withRecord.length ? withRecord[0] : monthPrefix + '01';
  }

  const sel = r.byDay[cs.selectedKey];
  const parts = cs.selectedKey.split('-');
  const now = new Date();
  const canNext = !(cs.year === now.getFullYear() && cs.month === now.getMonth() + 1);

  const body = `<div class="card" style="margin-top:12px;padding:12px 14px 14px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--divider)">
        <span class="tap cal-nav" data-act="cal-prev">‹</span>
        <span style="font-size:17px;font-weight:600">${cs.year}年${cs.month}月</span>
        <span class="tap cal-nav" data-act="cal-next" style="${canNext ? '' : 'opacity:.32'}">›</span>
      </div>
      <div style="display:flex;margin-top:12px">
        <div style="flex:1"><div style="font-size:11.5px;color:var(--text2)">本月已记录</div><div style="font-size:19px;font-weight:600;margin-top:3px">${r.count} 顿</div></div>
        <div class="tap" data-act="go-stats" style="flex:1"><div style="font-size:11.5px;color:var(--text2)">本月消费</div><div style="font-size:19px;font-weight:600;margin-top:3px;color:var(--primary)">${esc(r.totalText)}</div></div>
      </div>
    </div>

    <div class="card" style="margin-top:12px;padding:12px 8px 10px">
      <div class="cal-week">${['一', '二', '三', '四', '五', '六', '日'].map((w) => `<div class="cal-week-cell">${w}</div>`).join('')}</div>
      <div class="cal-grid">
        ${cells
          .map(
            (c) => `<div class="cal-cell ${c.empty ? 'cal-cell--empty' : ''} ${c.today ? 'cal-cell--today' : ''} ${!c.empty && c.key === cs.selectedKey ? 'cal-cell--on' : ''}" ${c.empty ? '' : `data-act="cal-day" data-key="${c.key}"`}>
          ${c.empty ? '' : `<span class="cal-day">${c.day}</span><span class="cal-dots">${c.has ? '<i></i>' : ''}</span>`}
        </div>`
          )
          .join('')}
      </div>
    </div>

    <div class="card" style="margin-top:12px;padding:0 14px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 10px;border-bottom:1px solid var(--divider)">
        <span style="font-size:16px;font-weight:600">${Number(parts[1])}月${Number(parts[2])}日</span>
        <span style="font-size:13px;color:${sel ? 'var(--primary)' : 'var(--text3)'};font-weight:${sel ? 500 : 400}">${sel ? '当天 ' + esc(sel.totalText) : '当天没有记录'}</span>
      </div>
      ${(sel ? sel.byType : C.MEAL_TYPES.map((t) => ({ label: t.label, emoji: t.emoji, meal: null })))
        .map(
          (s) => `<div class="${s.meal ? 'tap ' : ''}day-row" ${s.meal ? `data-act="open-meal" data-id="${s.meal.id}"` : ''}>
        <div class="day-row-left"><span class="day-emoji">${s.emoji}</span>
          <div><div class="day-type">${s.label}</div><div class="day-name">${s.meal ? esc(s.meal.name) : '还没记录'}</div></div>
        </div>
        <div class="day-row-right">${s.meal ? `<span class="day-amount">${esc(s.meal.amountText)}</span><span class="cell-arrow">›</span>` : ''}</div>
      </div>`
        )
        .join('')}
      ${sel ? `<div style="font-size:10.5px;color:var(--text3);padding:10px 0 14px;line-height:1.7">饭历只包含真实已经吃过的饭。收藏和餐单计划不会出现在这里。</div>` : ''}
    </div>`;

  return { title: '我的饭历', body: `<div class="screen-body" style="padding:0 16px 28px">${body}</div>` };
}

const SCREENS = {
  home: screenHome,
  record: screenRecord,
  mine: screenMine,
  random: screenRandom,
  'meal-detail': screenMealDetail,
  author: screenAuthor,
  calendar: screenCalendar,
  plan: screenPlan,
  wish: screenWish,
  'wish-edit': screenWishEdit,
  following: screenFollowing,
  stats: screenStats,
  settings: screenSettings,
  'onboard-profile': screenOnboardProfile,
  'onboard-location': screenOnboardLocation,
  welcome: screenWelcome
};

const TAB_TITLES = { home: '吃什么', record: '记一顿', mine: '我的' };

function current() {
  return S.stack.length ? S.stack[S.stack.length - 1] : { name: S.tab, params: {} };
}

function go(name, params) {
  S.stack.push({ name, params: params || {} });
  render();
}
function back() {
  S.stack.pop();
  render();
}
function switchTab(name) {
  S.tab = name;
  S.stack = [];
  render();
}

/* ---------------- 渲染 ---------------- */
function render() {
  // 未完成引导：任何 tab 页都先回首次进入流程
  const cur = current();
  const onboardPages = ['onboard-profile', 'onboard-location', 'welcome'];
  if (!store.hasOnboarded() && onboardPages.indexOf(cur.name) === -1) {
    S.stack = [{ name: 'onboard-profile', params: {} }];
  }

  const c = current();
  const build = SCREENS[c.name] || screenHome;
  const v = build(c.params || {});

  const showTab = !!v.tab && S.stack.length === 0;
  const activeTab = showTab ? v.tab : '';
  const tabs = [
    { key: 'home', label: '首页' },
    { key: 'record', label: '记一顿' },
    { key: 'mine', label: '我的' }
  ];

  const nav = v.customNav
    ? ''
    : `<div class="navbar ${v.plainNav ? 'navbar--plain' : ''}">
        ${S.stack.length ? `<div class="navbar__back" data-act="back">‹</div>` : ''}
        <div class="nav-title">${esc(v.title || TAB_TITLES[c.name] || '')}</div>
        <div class="nav-right"></div>
      </div>`;

  const tabbar = showTab
    ? `<div class="tabbar">${tabs
        .map((t) =>
          t.key === 'record'
            ? `<div class="tap tab tab-center" data-act="switch-tab" data-key="record">
                <div class="fab"><i></i></div><div class="tab-label tab-label--fab">${t.label}</div>
              </div>`
            : `<div class="tap tab ${activeTab === t.key ? 'tab--on' : ''}" data-act="switch-tab" data-key="${t.key}">
                <div class="tab-icon tab-icon--${t.key} ${activeTab === t.key ? 'is-on' : ''}"></div>
                <div class="tab-label">${t.label}</div>
              </div>`
        )
        .join('')}</div>`
    : '';

  const app = document.getElementById('app');
  app.innerHTML = `${nav}<div class="screen ${showTab ? 'screen--tab' : ''}">${v.body}</div>${tabbar}${v.fixedBottom || ''}`;

  // 浮层（遮罩 / 底部面板 / 弹窗 / Toast）挂在 #app 内部，跟随手机圆角裁切
  let ov = document.getElementById('overlay-layer');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'overlay-layer';
    ov.className = 'overlay-layer';
  }
  app.appendChild(ov);
  ov.innerHTML = regionSheetHtml() + planSheetHtml() + (v.extra || '') + overlayHtml();
}

      mealType: el.dataset.type,
      name: t.name,
      referenceAmount: t.amount,
      sourceType: t.sourceType,
      sourceId: t.sourceId,
      sourceUserName: t.sourceUserName
    });
    const label = (C.MEAL_TYPES.find((x) => x.key === el.dataset.type) || {}).label;

    S.planSheet = null;

    render();
    dialog({
      title: `已加入我的餐单`,
      body: `${day}${label} · ${t.name}\n\n这只是计划，吃完后点「我吃了」并完成记录，才会进入饭历和消费统计。`,
      confirmText: '去餐单看看',

      onOk: () => go('plan')
    });
  },

  /* 记一顿 */
  'rec-meal': (el) => {
    ensureRecordForm().mealType = el.dataset.key;
    render();
  },
  'rec-open-time': () => {
    ensureRecordForm().timeSheet = true;
    render();
  },
  'rec-confirm-time': () => {
    const d = ensureRecordForm();
    const dateEl = document.getElementById('rec-date');
    const timeEl = document.getElementById('rec-time');
    if (dateEl && dateEl.value) d.dateStr = dateEl.value;
    if (timeEl && timeEl.value) d.timeStr = timeEl.value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.dateStr) || !/^\d{2}:\d{2}$/.test(d.timeStr)) {
      d.timeSheet = false;
      return render();
    }
    const dp = d.dateStr.split('-').map(Number);
    const tp = d.timeStr.split(':').map(Number);
    const ts = new Date(dp[0], dp[1] - 1, dp[2], tp[0], tp[1], 0, 0).getTime();
    d.mealType = F.currentMealType(ts); // 补记时按实际时间自动校正餐次
    d.timeSheet = false;
    render();
    toast(`已按 ${d.timeStr} 归档，餐次自动切到${(C.MEAL_TYPES.find((t) => t.key === d.mealType) || {}).label}`);
  },
  'rec-amount-unknown': () => {
    const d = ensureRecordForm();
    d.amountUnknown = !d.amountUnknown;
    if (d.amountUnknown) d.amount = '';
    render();
  },

  },
  'rec-toggle-settings': () => {
    const d = ensureRecordForm();
    d.settingsOpen = !d.settingsOpen;
    render();
  },
  'rec-vis': (el) => {
    ensureRecordForm().visibility = el.dataset.key;
    render();
  },
  'rec-locmode': (el) => {
    ensureRecordForm().locMode = el.dataset.key;
    render();
  },
  'rec-moodvis': (el) => {
    ensureRecordForm().moodVisibility = el.dataset.key;
    render();
  },
  'rec-submit': () => {
    const d = ensureRecordForm();
    const nameEl = document.getElementById('rec-name');
    const amountEl = document.getElementById('rec-amount');
    const moodEl = document.getElementById('rec-mood');
    const placeEl = document.getElementById('rec-place');
    if (nameEl) d.name = nameEl.value;
    if (amountEl) d.amount = amountEl.value;
    if (moodEl) d.moodText = moodEl.value;
    if (placeEl) d.placeName = placeEl.value;

    if (!d.name.trim()) return toast('先写一下吃了什么');

    const me = store.getRawMe();
    const dp = d.dateStr.split('-').map(Number);
    const tp = d.timeStr.split(':').map(Number);
    const eatenAt = new Date(dp[0], dp[1] - 1, dp[2], tp[0], tp[1], 0, 0).getTime();

    const location =
      d.locMode === 'none'
        ? { placeName: '', areaName: '', displayMode: 'hidden', distanceKm: null, provided: false }
        : {
            placeName: d.locMode === 'exact' ? d.placeName || '未命名小馆' : '',
            areaName: me.region || C.DEFAULT_REGION.name,
            displayMode: d.locMode,
            distanceKm: 0.3,
            provided: true
          };

    const meal = store.addMeal({
      mealType: d.mealType,
      eatenAt,
      name: d.name,
      amount: d.amount,
      amountUnknown: d.amountUnknown || d.amount === '',
      imageUrls: [],
      moodText: d.moodText,
      moodVisibility: d.moodVisibility,
      visibility: d.visibility,
      location
    });

    if (d.images.length) SESSION_IMAGES[meal.id] = d.images[0];
    if (d.draftPlanId) store.completePlan(d.draftPlanId);

    const isPrivate = d.visibility === 'private';
    S.lastMeal = meal;
    S.record = null;
    S.done = meal.name;
    render();

    setTimeout(() => {
      S.done = null;
      if (isPrivate) {
        S.calendar = null;
        go('calendar');
      } else {
        S.home.mealType = meal.mealType;
        switchTab('home');
      }
    }, 1500);
  },

  /* 作者 */
  'toggle-follow': (el) => {
    const on = store.toggleFollow(el.dataset.id);
    toast(on ? '以后多看看 TA 吃什么' : '已取消跟吃');
    render();
  },

  /* 我的 */
  'edit-profile': () => {
    const me = store.getRawMe();
    onboardDraft.nickname = me.nickname;
    onboardDraft.avatarEmoji = me.avatarEmoji || '🐕';
    S.stack.push({ name: 'onboard-profile', params: {}, editing: true });
    render();
  },
  'mine-slot': (el) => go(el.dataset.recorded === 'true' ? 'calendar' : 'plan'),

  /* 饭历 */
  'cal-prev': () => {
    const cs = ensureCalendar();
    cs.month -= 1;
    if (cs.month < 1) {
      cs.month = 12;
      cs.year -= 1;
    }
    cs.selectedKey = '';
    render();
  },
  'cal-next': () => {
    const cs = ensureCalendar();
    const n = new Date();
    if (cs.year === n.getFullYear() && cs.month === n.getMonth() + 1) return;
    cs.month += 1;
    if (cs.month > 12) {
      cs.month = 1;
      cs.year += 1;
    }
    cs.selectedKey = '';
    render();
  },
  'cal-day': (el) => {
    const cs = ensureCalendar();
    const r = store.getCalendarMonth(cs.year, cs.month);
    cs.selectedKey = el.dataset.key;
    if (!r.byDay[el.dataset.key]) cs.selectedKey = el.dataset.key;
    render();
  },

  /* 餐单 */
  'plan-day': (el) => {
    S.plan.day = Number(el.dataset.i);
    render();
  },
  'plan-cancel': (el) => {
    const board = store.getPlanBoard();
    const slot = board[S.plan.day].slots.find((s) => s.mealType === el.dataset.slot);
    if (!slot) return;
    dialog({
      title: '取消这一餐？',
      body: '取消后不会留下任何饭历记录。',
      confirmText: '取消安排',
      cancelText: '再想想',
      onOk: () => {
        store.cancelPlan(slot.planId);
        render();
      }
    });
  },
  'plan-ate': (el) => {
    const board = store.getPlanBoard();
    const slot = board[S.plan.day].slots.find((s) => s.mealType === el.dataset.slot);
    if (!slot) return;
    const d = ensureRecordForm();
    d.name = slot.name;
    d.mealType = slot.mealType;
    d.dateStr = board[S.plan.day].key;
    d.amount = slot.referenceAmountText ? slot.referenceAmountText.replace(/[^\d.]/g, '') : '';
    d.amountUnknown = false;
    d.draftPlanId = slot.planId;
    S.record = d;
    switchTab('record');
    toast('已帮你填好这一顿，确认金额就能记下');
  },

  /* 想吃 */
  'wish-plan': (el) => {
    const w = store.getWishes().find((x) => x.id === el.dataset.id);
    if (!w) return;
    S.planTarget = {
      name: w.name,
      amount: w.expectedAmount,
      sourceType: 'wish',
      sourceId: w.id,
      sourceUserName: ''
    };
    S.planSheet = { title: '安排到餐单', desc: `${w.name} · 这只是计划，不算已经吃过` };
    render();
  },
  'wish-ate': (el) => {
    const w = store.getWishes().find((x) => x.id === el.dataset.id);
    if (!w) return;
    const d = ensureRecordForm();
    d.name = w.name;
    d.amount = w.expectedAmount ? String(w.expectedAmount) : '';
    d.locMode = w.placeName ? 'exact' : 'fuzzy';
    d.placeName = w.placeName || '';
    S.record = d;
    switchTab('record');
    toast('已帮你填好这一顿');
  },
  'wish-remove': (el) => {
    dialog({
      title: '从我的想吃里移除？',
      body: '移除后不会影响你的饭历和消费统计。',
      confirmText: '移除',
      cancelText: '留下',
      onOk: () => {
        store.removeWish(el.dataset.id);
        render();
      }
    });
  },
  'we-submit': () => {
    const d = ensureWishEdit();
    const nameEl = document.getElementById('we-name');
    const placeEl = document.getElementById('we-place');
    const amountEl = document.getElementById('we-amount');
    const noteEl = document.getElementById('we-note');
    if (nameEl) d.name = nameEl.value;
    if (placeEl) d.placeName = placeEl.value;
    if (amountEl) d.expectedAmount = amountEl.value;
    if (noteEl) d.note = noteEl.value;
    if (!d.name.trim()) return toast('写点什么想吃的');

    const me = store.getRawMe();
    const w = store.addWish({
      name: d.name,
      placeName: d.placeName,
      areaName: me.region || '',
      expectedAmount: d.expectedAmount,
      note: d.note
    });
    if (d.images.length) SESSION_IMAGES[w.id] = d.images[0];
    S.wishEdit = null;
    toast('已经放进我的想吃');
    setTimeout(() => back(), 500);
  },

  /* 跟吃 */
  unfollow: (el) => {
    dialog({
      title: `取消跟吃 ${el.dataset.name}？`,
      body: '取消后他/她的饭记不再优先出现在你的饭流里。',
      confirmText: '取消跟吃',
      cancelText: '继续跟吃',
      onOk: () => {
        store.toggleFollow(el.dataset.id);
        render();
      }
    });
  },

  /* 统计 */
  'stats-period': (el) => {
    S.stats.period = el.dataset.key;
    render();
  },

  /* 设置 */
  'settings-tab': (el) => {
    S.settings.tab = el.dataset.key;
    render();
  },
  'manual-toggle': (el) => {
    const i = Number(el.dataset.i);
    S.settings.openIndex = S.settings.openIndex === i ? -1 : i;
    render();
  },
  'privacy-rules': () =>
    dialog({
      title: '内容与公开规则',
      body: '饭记可见范围：公开 / 仅附近可见 / 仅自己可见。\n地点可见范围：具体地点 / 模糊区域 / 不公开。\n感受可见范围：公开 / 仅自己可见。\n三类权限相互独立，每一顿都可以单独设置。',
      confirmText: '知道了'
    }),
  'reset-demo': () =>
    dialog({
      title: '重置演示数据？',
      body: '会把昵称、头像、饭记、餐单、想吃全部恢复成初始假数据，用于重新走一遍完整流程。',
      confirmText: '确认重置',
      cancelText: '取消',
      onOk: () => {
        store.reset();
        S.stack = [];
        S.tab = 'home';
        S.record = null;
        S.calendar = null;
        S.home.mealType = F.currentMealType();
        Object.keys(SESSION_IMAGES).forEach((k) => delete SESSION_IMAGES[k]);
        render();
        toast('已重置');
      }
    }),

  /* 通用 */
  'close-sheet': () => {
    S.regionSheet = false;
    S.planSheet = null;
    S.planTarget = null;
    if (S.record) {
      const d = S.record;
      const placeEl = document.getElementById('rec-place');
      if (placeEl && d.locSheet) d.placeName = placeEl.value;
      d.timeSheet = false;
      d.locSheet = false;
      const dateEl = document.getElementById('rec-date');
      const timeEl = document.getElementById('rec-time');
      if (dateEl && dateEl.value && /^\d{4}-\d{2}-\d{2}$/.test(dateEl.value)) d.dateStr = dateEl.value;
      if (timeEl && timeEl.value && /^\d{2}:\d{2}$/.test(timeEl.value)) d.timeStr = timeEl.value;
    }
    render();
  },
  'dialog-ok': () => {
    const d = S.dialog;
    S.dialog = null;
    render();
    if (d && d.onOk) setTimeout(d.onOk, 10);
  },
  'dialog-cancel': () => {
    S.dialog = null;
    render();
  }
};

/* ---------------- 轻量 UI ---------------- */
let toastTimer = null;
function toast(text) {
  S.toast = text;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    S.toast = null;
    render();
  }, 1700);
}

function dialog(opt) {
  S.dialog = {
    title: opt.title,
    body: opt.body || '',
    confirmText: opt.confirmText,
    cancelText: opt.cancelText,
    onOk: opt.onOk
  };
  render();
}

/* 演示版选图：读成 dataURL，只存在会话里 */
function pickImage(isWish) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const target = isWish ? ensureWishEdit() : ensureRecordForm();
      if (isWish) target.images = [reader.result];
      else if (target.images.length < 3) target.images.push(reader.result);
      render();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* ---------------- 事件绑定 ---------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  e.stopPropagation();
  fn(el);
});

// 表单输入：只更新状态，不重渲染（否则会丢焦点）
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t.id) return;
  if (t.id === 'nick-input') {
    onboardDraft.nickname = t.value;
    return;
  }
  const d = S.record;
  if (d) {
    if (t.id === 'rec-name') d.name = t.value;
    if (t.id === 'rec-amount') d.amount = t.value;
    if (t.id === 'rec-place') d.placeName = t.value;
    if (t.id === 'rec-mood') {
      d.moodText = t.value;
      const c = document.getElementById('mood-count');
      if (c) c.textContent = String(t.value.length);
    }
    if (t.id === 'rec-date') d.dateStr = t.value;
    if (t.id === 'rec-time') d.timeStr = t.value;
  }
  const w = S.wishEdit;
  if (w) {
    if (t.id === 'we-name') w.name = t.value;
    if (t.id === 'we-place') w.placeName = t.value;
    if (t.id === 'we-amount') w.expectedAmount = t.value;
    if (t.id === 'we-note') {
      w.note = t.value;
      const c = document.getElementById('we-note-count');
      if (c) c.textContent = String(t.value.length);
    }
  }
});

/* ---------------- 演示工具条 ---------------- */
function bindDemoBar() {
  const bar = document.getElementById('demo-bar');
  if (!bar) return;
  bar.addEventListener('click', (e) => {
    const el = e.target.closest('[data-demo]');
    if (!el) return;
    const act = el.dataset.demo;
    if (act === 'onboard') {
      store.saveMe({ onboarded: false, regionKey: '', region: '' });
      S.stack = [{ name: 'onboard-profile', params: {} }];
      render();
    }
    if (act === 'letter') go('welcome');
    if (act === 'manual') {
      S.settings.tab = 'manual';
      go('settings');
    }
    if (act === 'reset') ACT['reset-demo']();
  });
}

/* ---------------- 启动 ---------------- */
store.completeOnboarding(); // 演示默认已登录，可从工具条「重走首次进入」体验完整引导
render();
bindDemoBar();

</script>
